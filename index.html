<title>타자 퀴즈</title>
<style>
:root{
  --bg:#0a0c10; --s1:#10131a; --s2:#161a23; --s3:#1e232e;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --text:#e9ebf1; --sub:#8a91a3; --mute:#5c6376;
  --accent:#8ea2ff; --accent-soft:rgba(142,162,255,.14);
  --good:#5fd3a0; --bad:#ff7b8b; --warn:#f2c56b;
  --vh:100dvh; --vt:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font:400 15px/1.45 "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
[hidden]{display:none!important}
em{font-style:normal}
.muted{color:var(--mute)}

#app{position:fixed;left:0;right:0;top:var(--vt);height:var(--vh);overflow:hidden;
  background:radial-gradient(900px 520px at 50% -10%,rgba(142,162,255,.10),transparent 70%),var(--bg)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;min-height:0;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---- icons ---- */
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.grip{width:14px;height:14px;stroke-width:3.6;color:var(--mute)}
.chev{width:16px;height:16px;transition:transform .18s;color:var(--mute)}
.chev.on{transform:rotate(90deg)}

/* ---- bars / buttons ---- */
.bar{display:flex;align-items:center;gap:6px;padding:10px 12px;min-height:58px;flex:none}
.bar-title{margin:0;flex:1;min-width:0;font-size:17px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-actions{display:flex;gap:6px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;margin:0;padding-left:6px;font-size:21px;font-weight:760;letter-spacing:-.025em}
.brand .i{width:26px;height:26px;color:var(--accent)}
.icon-btn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;color:var(--sub);flex:none;transition:background .15s,color .15s,transform .1s}
.icon-btn:hover{background:var(--s2);color:var(--text)}
.icon-btn:active{transform:scale(.92)}
.icon-btn.sm{width:34px;height:34px;border-radius:10px}
.icon-btn.sm .i{width:17px;height:17px}
.icon-btn.del:hover{color:var(--bad)}
.btn{height:46px;padding:0 18px;border-radius:13px;background:var(--s3);border:1px solid var(--line);font-weight:620;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:border-color .15s,filter .15s,transform .1s,opacity .15s}
.btn:hover{border-color:var(--line2)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:transparent;color:#0a0c10}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:rgba(255,123,139,.12);border-color:rgba(255,123,139,.28);color:var(--bad)}
.btn.sm{height:36px;padding:0 13px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.38;pointer-events:none}
.btn .i{width:18px;height:18px}
.txt-btn{padding:7px 11px;border-radius:9px;color:var(--sub);font-size:13px;font-weight:620}
.txt-btn:hover{color:var(--text);background:var(--s2)}
.mini{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:30px;padding:0 10px;border-radius:9px;font-size:12px;font-weight:620;color:var(--sub);background:var(--s2);border:1px solid var(--line);transition:color .15s,border-color .15s,background .15s;flex:none}
.mini:hover{color:var(--text);border-color:var(--line2)}
.mini .i{width:14px;height:14px}
.mini.sq{width:30px;padding:0}
.mini.del:hover{color:var(--bad)}
.mini.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.mini.primary{background:var(--accent);color:#0a0c10;border-color:transparent}
.count-pill{font-size:12px;font-weight:700;color:var(--sub);background:var(--s2);border:1px solid var(--line);padding:4px 11px;border-radius:99px;font-variant-numeric:tabular-nums}
.count-pill:empty{display:none}

/* ---- layout ---- */
.body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:6px 16px 32px}
.foot{flex:none;display:flex;gap:10px;padding:12px max(16px,calc((100% - 760px)/2));border-top:1px solid var(--line);background:rgba(10,12,16,.7);backdrop-filter:blur(10px)}
.foot .btn{flex:1}.foot .primary{flex:1.6}
.empty{padding:56px 16px;text-align:center;color:var(--mute);font-size:14px}

/* ---- forms ---- */
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field>span,.field-row>span{font-size:12px;font-weight:650;color:var(--sub);letter-spacing:.02em}
.field-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inp{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;font-size:16px;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:84px;line-height:1.5}
.inp.drag-over{border-color:var(--accent);background:var(--accent-soft)}
.prev{position:relative;margin-top:2px}
.prev img{max-width:100%;max-height:170px;border-radius:12px;border:1px solid var(--line);display:block}
.prev .mini{position:absolute;top:8px;right:8px;background:rgba(10,12,16,.82)}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--s1);border:1px solid var(--line)}
.seg button{flex:1;height:38px;border-radius:10px;color:var(--sub);font-weight:620;transition:background .15s,color .15s}
.seg button.on{background:var(--s3);color:var(--text)}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:12px 14px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-weight:620;color:var(--sub);text-align:left}
.sw-row[aria-pressed="true"]{color:var(--text);border-color:var(--line2)}
.sw-l{display:inline-flex;align-items:center;gap:9px}
.sw{width:42px;height:25px;border-radius:99px;background:var(--s3);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#7e869a;transition:transform .2s,background .2s}
.sw-row[aria-pressed="true"] .sw{background:var(--accent)}
.sw-row[aria-pressed="true"] .sw::after{transform:translateX(17px);background:#0a0c10}

/* ---- home ---- */
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0 26px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding:16px;border-radius:18px;background:var(--s1);border:1px solid var(--line);text-align:left;font-weight:640;font-size:14px;transition:border-color .15s,background .15s,transform .1s}
.tile:hover{border-color:var(--line2);background:var(--s2)}
.tile:active{transform:scale(.98)}
.tile .i{width:24px;height:24px;color:var(--accent)}
.badge{position:absolute;top:12px;right:12px;min-width:21px;height:21px;padding:0 6px;border-radius:99px;background:var(--bad);color:#0a0c10;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.sect-label{font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.08em;margin:0 2px 10px}
.subject{display:flex;align-items:center;gap:12px;width:100%;padding:16px 18px;margin-bottom:10px;border-radius:18px;background:var(--s1);border:1px solid var(--line);text-align:left;transition:border-color .15s,background .15s,transform .1s}
.subject:hover{border-color:var(--line2);background:var(--s2)}
.subject:active{transform:scale(.99)}
.subject-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.subject-txt b{font-size:16px;font-weight:660;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subject-txt small{color:var(--sub);font-size:13px}
.subject .i{color:var(--mute);width:18px;height:18px}

/* ---- layers / sheets / dialogs ---- */
.layer{position:absolute;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;visibility:hidden;pointer-events:none;transition:visibility 0s linear .26s}
.layer.open{visibility:visible;pointer-events:auto;transition-delay:0s}
.scrim{position:absolute;inset:0;background:rgba(3,5,10,.64);opacity:0;transition:opacity .24s;backdrop-filter:blur(4px)}
.layer.open .scrim{opacity:1}
.sheet,.dlg{position:relative;width:100%;max-width:580px;max-height:88%;display:flex;flex-direction:column;background:var(--s1);border:1px solid var(--line2);border-radius:24px 24px 0 0;padding-bottom:env(safe-area-inset-bottom);transform:translateY(28px);opacity:0;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s}
.layer.open .sheet,.layer.open .dlg{transform:none;opacity:1}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line2);margin:10px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;gap:6px;padding:16px 14px 8px 20px;flex:none}
.sheet-head h2{flex:1;margin:0;min-width:0;font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:6px 20px 16px}
.sheet-foot{display:flex;gap:10px;padding:12px 20px 16px;border-top:1px solid var(--line);flex:none}
.sheet-foot .btn{flex:1}.sheet-foot .primary{flex:2}
.qe-body{display:flex;flex-direction:column;gap:14px}
@media(min-width:700px){
  .layer{align-items:center}
  .sheet{border-radius:24px;max-height:82%}
  .grab{display:none}
}
.grp{margin-bottom:16px}
.grp-label{font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.06em;margin:4px 2px 10px}
.grp-head{display:flex;align-items:center;gap:9px;width:100%;padding:6px 2px 10px;color:var(--sub);font-weight:650;font-size:13px;text-align:left}
.grp-head .i{width:16px;height:16px}
.gname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp-head em{color:var(--mute);font-size:12px;font-weight:500}
.tick{width:20px;height:20px;border-radius:7px;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;color:transparent;transition:background .15s,border-color .15s}
.tick .i{width:13px;height:13px;stroke-width:3.4}
.grp-head.all .tick{background:var(--accent);border-color:var(--accent);color:#0a0c10}
.grp-head.part .tick{border-color:var(--accent)}
.grp-head.part .tick::after{content:"";width:8px;height:2.5px;border-radius:2px;background:var(--accent)}
.grp-head.part .tick .i{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;background:var(--s2);border:1px solid var(--line);font-size:14px;font-weight:560;transition:background .15s,border-color .15s,color .15s}
.chip em{color:var(--mute);font-size:12px;font-weight:500}
.chip:hover{border-color:var(--line2)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:#fff}
.chip.on em{color:var(--accent)}

#dlgLayer{align-items:center;padding:20px;z-index:80}
#dlgLayer .dlg{max-width:390px;border-radius:22px;padding:22px 20px 18px;gap:12px}
.dlg h3{margin:0;font-size:17px;font-weight:700}
.dlg p{margin:0;color:var(--sub);font-size:14px;line-height:1.55}
.dlg-list{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow-y:auto}
.dlg-item{padding:13px 14px;border-radius:12px;background:var(--s2);border:1px solid var(--line);text-align:left;font-weight:600;transition:border-color .15s}
.dlg-item:hover{border-color:var(--accent)}
.dlg-actions{display:flex;gap:10px;margin-top:4px}.dlg-actions .btn{flex:1}
#qeLayer{z-index:60}

.layer.lb{z-index:90;align-items:center;background:rgba(3,5,10,.95);opacity:0;touch-action:none;transition:opacity .2s,visibility 0s linear .2s}
.layer.lb.open{opacity:1;transition-delay:0s}
.lb img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;will-change:transform;border-radius:6px}
.lb-close{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;background:rgba(255,255,255,.14);color:#fff;border-radius:50%}

.toast{position:absolute;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));z-index:100;max-width:calc(100% - 32px);transform:translate(-50%,10px);padding:11px 18px;border-radius:99px;background:rgba(30,35,46,.96);border:1px solid var(--line2);font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:rgba(255,123,139,.5);color:var(--bad)}

/* ---- game ---- */
.game-hud{display:flex;align-items:center;gap:8px;height:50px;padding:0 6px;color:var(--sub);font-weight:650;font-size:14px;font-variant-numeric:tabular-nums}
.spacer{flex:1}
.g-strict{display:inline-flex;color:var(--accent)}.g-strict .i{width:17px;height:17px}
.g-time{display:inline-block;min-width:38px;text-align:right;padding-right:10px;font-size:25px;font-weight:800;color:var(--accent);transform-origin:right center;transition:color .2s}
.timer{height:4px;background:var(--s2)}
.timer-fill{height:100%;width:100%;background:var(--accent);transform-origin:left center;will-change:transform;transition:background-color .3s}
.game-top[data-lv="1"] .timer-fill{background:var(--warn)}.game-top[data-lv="1"] .g-time{color:var(--warn)}
.game-top[data-lv="2"] .timer-fill{background:var(--bad)}.game-top[data-lv="2"] .g-time{color:var(--bad)}
.game-top.urgent .g-time{animation:pulse .5s ease-in-out infinite alternate}
.game-top.urgent .timer-fill{animation:blink .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.18)}}
@keyframes blink{to{opacity:.55}}
.game-stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px 16px;width:100%;max-width:900px;margin:0 auto}
.g-img{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.g-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:14px;cursor:zoom-in;background:var(--s1)}
.g-q{max-width:100%;text-align:center;font-size:clamp(17px,2.4vw,22px);font-weight:600;line-height:1.5;overflow-wrap:anywhere;overflow-y:auto}
.game-stage.text-only .g-q{font-size:clamp(24px,4.2vw,36px);font-weight:660;line-height:1.45}
.game-stage.hit .g-q,.game-stage.hit .g-img{animation:hit .18s ease}
@keyframes hit{50%{transform:scale(1.03)}}
.g-flash{position:absolute;left:16px;right:16px;bottom:14px;display:none;flex-direction:column;align-items:center;gap:3px;padding:12px 16px;border-radius:15px;background:rgba(16,19,26,.97);border:1px solid rgba(255,123,139,.42);color:var(--bad);text-align:center;font-weight:700;font-size:18px;overflow-wrap:anywhere}
.g-flash small{font-size:11px;letter-spacing:.1em;opacity:.8}
.g-flash.show{display:flex;animation:fade .15s}
.game-input{flex:none;display:flex;align-items:center;gap:6px;padding:6px 8px 6px max(16px,calc((100% - 900px)/2 + 16px));border-top:1px solid var(--line);background:rgba(10,12,16,.72);backdrop-filter:blur(10px)}
.game-input .icon-btn{margin-right:max(0px,calc((100% - 900px)/2))}
.game-input input{flex:1;min-width:0;height:46px;padding:0 4px;border:0;border-bottom:2px solid var(--line2);border-radius:0;background:transparent;font-size:18px;outline:none;transition:border-color .15s}
.game-input input:focus{border-color:var(--accent)}
.game-input input.ok{border-color:var(--good)}
.game-input input.bad{border-color:var(--bad);animation:shake .25s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---- result ---- */
.result{margin:auto;display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px;text-align:center;max-width:520px}
.ring-wrap{position:relative;width:184px;height:184px}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring-bg{stroke:var(--s3)}
.ring-fg{stroke:var(--accent);stroke-dasharray:326.73;stroke-dashoffset:326.73;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.r-score{font-size:48px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.r-total{margin-top:6px;color:var(--sub);font-size:14px;font-weight:600}
.r-desc{color:var(--sub);font-size:14px;overflow-wrap:anywhere}
.result .btn{min-width:200px}

/* ---- sync / brand / wrong subjects ---- */
.brand-img{width:30px;height:30px;border-radius:8px;display:block;flex:none}
.sync{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:99px;background:var(--s2);border:1px solid var(--line);font-size:12px;font-weight:650;color:var(--sub)}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--mute)}
.sync[data-st=ok] .dot{background:var(--good)}
.sync[data-st=err] .dot{background:var(--bad)}
.sync[data-st=conn] .dot,.sync[data-st=syncing] .dot,.sync[data-st=slow] .dot{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.wcnt{min-width:28px;height:28px;padding:0 8px;border-radius:99px;background:rgba(255,123,139,.14);color:var(--bad);font-weight:750;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
/* ---- wrong notes ---- */
.note{display:flex;align-items:flex-start;gap:12px;padding:14px;margin-bottom:10px;border-radius:16px;background:var(--s1);border:1px solid var(--line);content-visibility:auto;contain-intrinsic-size:auto 92px}
.miss{min-width:28px;height:28px;padding:0 6px;border-radius:9px;background:rgba(255,123,139,.14);color:var(--bad);font-weight:750;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.note-main{flex:1;min-width:0}
.note-meta{font-size:11px;font-weight:650;color:var(--accent);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-q{font-size:14px;overflow-wrap:anywhere}
.note-a{display:flex;align-items:center;gap:7px;margin-top:4px;font-size:13px;font-weight:620;color:var(--good);overflow-wrap:anywhere}
.tag{display:inline-flex;color:var(--accent)}.tag .i{width:14px;height:14px}
.note-thumb{width:54px;height:54px;border-radius:10px;object-fit:cover;border:1px solid var(--line);cursor:zoom-in;flex:none}
.note-acts{display:flex;flex-direction:column;gap:2px;flex:none}

/* ---- memorize ---- */
.mem-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;width:100%;max-width:760px;margin:0 auto}
.mem-body img{max-width:100%;max-height:40vh;object-fit:contain;border-radius:14px;border:1px solid var(--line);cursor:zoom-in}
.mem-q{font-size:20px;font-weight:620;text-align:center;line-height:1.5;overflow-wrap:anywhere}
.mem-a{min-height:36px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:24px;font-weight:700;text-align:center;overflow-wrap:anywhere}
.mem-a .full{color:var(--good)}
.mem-a .rev{display:inline-flex;align-items:center;gap:7px;color:var(--good);font-size:17px}

/* ---- manage ---- */
.manage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,360px) 1fr;gap:22px;width:100%;max-width:1120px;margin:0 auto;padding:6px 16px 16px}
.m-form,.m-list{min-height:0;overflow-y:auto;overscroll-behavior:contain}
.m-form{display:flex;flex-direction:column;gap:16px;padding-bottom:12px}
#mgSeg{display:none;margin:0 16px 10px;flex:none}
@media(max-width:860px){
  .manage{grid-template-columns:1fr;gap:0}
  .manage[data-tab="form"] .m-list{display:none}
  .manage[data-tab="list"] .m-form{display:none}
  #mgSeg{display:flex}
}
.acc{margin-bottom:10px}
.acc-head{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:13px;background:var(--s1);border:1px solid var(--line);cursor:pointer;user-select:none;-webkit-user-select:none;font-weight:650;font-size:14px;transition:border-color .15s}
.acc-head:hover{border-color:var(--line2)}
.acc-head.lvl2{background:transparent}
.acc-head.lvl3{background:var(--s2);font-size:13px;padding:9px 11px}
.acc-title{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.acc-title b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:inherit}
.acc-title em{color:var(--mute);font-size:12px;font-weight:500}
.acc-title .i:not(.grip){width:16px;height:16px;color:var(--sub)}
.acc-tools{display:flex;align-items:center;gap:6px;flex:none}
.acc-body{padding:8px 0 2px 12px;margin:0 0 0 12px;border-left:1px solid var(--line)}
.fold,.topic{margin-bottom:8px}
.fold.dragging,.topic.dragging{opacity:.4}
.fold.drop-in,.uncat.drop-in{outline:2px dashed var(--accent);outline-offset:2px;border-radius:13px;background:var(--accent-soft)}
.fold.drop-above{box-shadow:0 -2px 0 var(--accent)}
.fold.drop-below{box-shadow:0 2px 0 var(--accent)}
.uncat{min-height:8px;border-radius:13px}
#app.dragging .uncat{min-height:44px}
.qrow{display:flex;align-items:center;gap:10px;padding:9px 10px;margin:6px 0;border-radius:12px;background:var(--s1);border:1px solid var(--line)}
.qthumb{width:46px;height:38px;border-radius:8px;object-fit:cover;border:1px solid var(--line);flex:none;cursor:zoom-in}
.qtext{flex:1;min-width:0}
.q1{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q2{font-size:12px;color:var(--good);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qacts{display:flex;gap:5px;flex:none}


/* ---- search ---- */
.sq-wrap{position:relative;padding:4px 20px 10px;flex:none}
.sq-wrap>.i{position:absolute;left:34px;top:50%;transform:translateY(-62%);width:17px;height:17px;color:var(--mute);pointer-events:none}
.sq-inp{padding-left:40px;padding-right:42px;height:44px}
.sq-clear{position:absolute;right:26px;top:50%;transform:translateY(-62%)}
.sq-info{font-size:12px;font-weight:650;color:var(--mute);margin:2px 2px 10px}
.sr{display:flex;align-items:center;gap:10px;padding:11px 12px;margin-bottom:8px;border-radius:13px;background:var(--s2);border:1px solid var(--line)}
.sr-main{flex:1;min-width:0}
.sr-meta{font-size:11px;font-weight:650;color:var(--accent);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-q{font-size:14px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sr-a{margin-top:3px;font-size:13px;font-weight:620;color:var(--good);overflow-wrap:anywhere}
.sr-thumb{width:44px;height:44px;border-radius:9px;object-fit:cover;border:1px solid var(--line);flex:none;cursor:zoom-in}
mark{background:rgba(242,197,107,.28);color:var(--warn);border-radius:4px;padding:0 1px}
</style>
</head>
<body>

<div id="app">

<!-- 홈 -->
<section class="screen on" id="s-home">
  <header class="bar"><h1 class="brand"><img class="brand-img" id="brandImg" alt="">타자 퀴즈</h1><div class="bar-actions" style="margin-left:auto"><button class="sync" id="syncBtn" data-st="off" type="button"><i class="dot"></i><span id="syncTxt">이 기기에만</span></button></div></header>
  <div class="body"><div class="wrap">
    <div class="quick">
      <button class="tile" data-go="manage"><i data-i="plusbox"></i><span>문제 만들기</span></button>
      <button class="tile" data-go="wrong"><i data-i="note"></i><span>오답노트</span><b class="badge" id="wBadge" hidden></b></button>

  const zoomAt = (ns, cx, cy) => {
    ns = Math.min(max, Math.max(min, ns));
    const r = el.getBoundingClientRect(), c = origin === 'center';
    const px = cx - r.left - (c ? r.width / 2 : 0), py = cy - r.top - (c ? r.height / 2 : 0), k = ns / st.s;

    set(ns, x, y);
  };

    pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 1) { moved = false; drag = { x: e.clientX, y: e.clientY, ox: st.x, oy: st.y }; }
    else if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, s: st.s }; drag = null; }
  });
  addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pinch && pts.size >= 2) {
      const [a, b] = [...pts.values()];
      zoomAt(pinch.s * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.d, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); moved = true;

    }
  });
  const up = e => {

    if (pts.size < 2) pinch = null;
    if (pts.size === 1) { const [p] = [...pts.values()]; drag = { x: p[0], y: p[1], ox: st.x, oy: st.y }; } else if (!pts.size) drag = null;
  };

  el.addEventListener('wheel', e => { e.preventDefault(); zoomAt(st.s * Math.exp(-e.deltaY * .0015), e.clientX, e.clientY); }, { passive: false });

}

 * 이미지 압축
 * ========================================================================= */
function compress(file, max = 1000, quality = .8) {
  return new Promise(res => {
    if (!file || !file.type.startsWith('image/')) return res(null);
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      URL.revokeObjectURL(url);
      const r = Math.min(1, max / Math.max(im.width, im.height)), w = Math.round(im.width * r), h = Math.round(im.height * r);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(im, 0, 0, w, h);
      let out = c.toDataURL('image/webp', quality);
      if (!out.startsWith('data:image/webp')) out = c.toDataURL('image/jpeg', quality);
      res(out);
    };
    im.onerror = () => { URL.revokeObjectURL(url); res(null); };
    im.src = url;
  });
}

let sQ = '', sRes = [];
const sTokens = v => [...new Set(String(v).toLowerCase().split(/\s+/).filter(Boolean))];
function searchQs(subject, query) {
  const toks = sTokens(query); if (!toks.length) return [];
  const out = [];
  for (const t in (D[subject] || {})) {
    const f = folderOf(subject, t).toLowerCase(), tl = t.toLowerCase();
    D[subject][t].forEach(q => {
      const ql = (q.q || '').toLowerCase(), al = String(q.a || '').toLowerCase();
      let score = 0, ok = true;
      for (const k of toks) {
        const kn = k.replace(/\s+/g, '');
        let sc = 0;
        if (al.includes(k) || norm(al).includes(kn)) sc += 3;
        if (ql.includes(k) || norm(ql).includes(kn)) sc += 2;
        if (tl.includes(k) || f.includes(k)) sc += 1;
        if (!sc) { ok = false; break; }
        score += sc;
      }
      if (ok) out.push({ q: { ...q, subject, topic: t }, score });
    });
  }
  return out.sort((a, b) => b.score - a.score);
}
function hl(text, toks) {
  const src = String(text ?? ''), low = src.toLowerCase(), rg = [];
  toks.forEach(k => { let i = 0; while ((i = low.indexOf(k, i)) >= 0) { rg.push([i, i + k.length]); i += k.length; } });
  if (!rg.length) return esc(src);
  rg.sort((a, b) => a[0] - b[0]);
  const m = [rg[0]];
  for (const r of rg.slice(1)) { const l = m[m.length - 1]; if (r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else m.push(r); }
  let o = '', p = 0;
  m.forEach(([a, b]) => { o += esc(src.slice(p, a)) + '<mark>' + esc(src.slice(a, b)) + '</mark>'; p = b; });
  return o + esc(src.slice(p));
}

function frameTimer(sec, onTick, onEnd) {
  let left = sec, last = 0, raf = 0, dead = false;
  const step = now => {
    if (dead) return;
    if (last) left -= Math.min(now - last, 100) / 1000;
    last = now;
    if (left <= 0) { dead = true; onTick(0); onEnd(); return; }
    onTick(left); raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
  return () => { dead = true; cancelAnimationFrame(raf); };
}

function preload(q) {

  const im = new Image(); im.decoding = 'async'; im.src = q.img; im.decode?.().catch(() => {}); preRef = im;
}

let tLv = -1, tSec = -1, tUr = null;

function startT() {
  stopT(); G.left = G.limit; tLv = tSec = -1; tUr = null; drawT();

}

  const s = Math.ceil(G.left);

  const ur = r < .25 && !G.locked;

}

function startGame(subject, topics, mode = 'normal', custom = null) {

  closeSheet(); go('game'); loadQ();

  const name = `typing_quiz_backup_${new Date().toISOString().slice(0, 10)}.json`;

async function importBackup(file) {

    const cd = p.customData || {};

      arr.push(e); ids.add(e.id);
    });
    for (const s in (p.topicFolders || {})) for (const t in p.topicFolders[s]) (TF[s] ??= {})[t] = p.topicFolders[s][t];
    for (const s in (p.createdFolders || {})) (p.createdFolders[s] || []).forEach(f => addFolder(s, f));
    (p.wrongNotes || []).forEach(n => {
      let i = n.id ? W.findIndex(x => x.id === n.id) : W.findIndex(x => x.subject === n.subject && x.topic === n.topic && x.q === n.q && x.a === n.a);
      if (i >= 0) { W[i].missCount = Math.max(W[i].missCount || 1, n.missCount || 1); if (n.img) W[i].img = n.img; if (n.strict) W[i].strict = true; }
      else { const e = { id: n.id, subject: n.subject, topic: n.topic, q: n.q, a: n.a, missCount: n.missCount || 1 }; if (n.img) e.img = n.img; if (n.strict) e.strict = true; W.push(e); }
    });

  function setSt(s, e) {

  const wObj = n => {
    const o = wNorm({ s: n.subject, t: n.topic, q: n.q, a: n.a, c: n.missCount, strict: n.strict });
    if (n.img) { const f = findCustom(n.id), cq = f && D[f.s][f.t][f.i]; if (!(cq && cq.img === n.img)) o.img = n.img; }

  };

  }

  /* kind별 병합 (loc: 로컬, remote: 클라우드, P: 마지막 동기화 해시) */
  function merge(kind, snap, loc, remote, hashRemote, remove, put) {

      } else {
        if (ph !== undefined) { push = true; continue; }                 // 이 기기에서 삭제 → 삭제를 올림
        put(id, v); Pk[id] = rh; changed = true;
      }
    }
    if (push) { dirty.add(kind); schedule(); }
    return changed;
  }
  function applyQ(snap) {
    const ch = merge('q', snap, localQ(), remoteMap(snap), v => hs(JSON.stringify(qObj(v.s, v.t, v))),
      id => { const f = findCustom(id); if (f) dropQ(f); }, (id, v) => putQ(id, qObj(v.s, v.t, v)));
    if (ch) { queueSave(K.custom, D); hydrateW(); queueSave(K.wrong, W); }
    return ch;
  }
  function applyW(snap) {
    const ch = merge('w', snap, localW(), remoteMap(snap), v => hs(JSON.stringify(wNorm(v))),
      id => { const i = W.findIndex(n => n.id === id); if (i >= 0) W.splice(i, 1); },
      (id, v) => {
        const n = { id, subject: v.s, topic: v.t, q: v.q || '', a: v.a || '', missCount: v.c || 1 };
        if (v.strict) n.strict = true; if (v.img) n.img = v.img;
        const i = W.findIndex(x => x.id === id); if (i >= 0) W[i] = n; else W.push(n);
      });
    if (ch) { hydrateW(); queueSave(K.wrong, W); }
    return ch;
  }
  function applyM(snap) {
    const v = snap.exists ? snap.data() : null, ls = JSON.stringify({ tf: TF, cf: CF }), lh = hs(ls);
    const empty = !Object.keys(TF).length && !Object.keys(CF).length;
    if (!v || typeof v.j !== 'string') { if (!empty) { dirty.add('m'); schedule(); } return false; }
    const rh = hs(v.j);
    if (P.m && lh !== P.m) { dirty.add('m'); schedule(); return false; }
    if (lh === rh) { P.m = rh; return false; }
    let p; try { p = JSON.parse(v.j); } catch { return false; }
    if (!P.m && !empty) {                                   // 처음 연결: 폴더 정보 합치기
      const tf = p.tf || {}, cf = p.cf || {};
      for (const s in TF) tf[s] = { ...TF[s], ...(tf[s] || {}) };
      for (const s in CF) cf[s] = [...new Set([...(cf[s] || []), ...CF[s]])];
      p = { tf, cf }; dirty.add('m'); schedule(); P.m = '';
    } else P.m = rh;
    TF = p.tf || {}; CF = p.cf || {}; queueSave(K.folders, TF); queueSave(K.created, CF);
    return true;
  }

  async function put(ref, o, id, kind) {
    try { await ref.set(o); }
    catch (e) { if (e?.code === 'invalid_argument') { P[kind][id] = hs(JSON.stringify(o)); if (!warned) { warned = true; toast('용량이 큰 일부 항목은 동기화되지 않았습니다', 'bad'); } } else throw e; }
  }
  async function pushKind(kind) {
    if (kind === 'm') {
      const ser = JSON.stringify({ tf: TF, cf: CF }), h = hs(ser), empty = !Object.keys(TF).length && !Object.keys(CF).length;
      if (h !== P.m && !(empty && !P.m)) { await mRef.set({ j: ser }); P.m = h; }
      return;
    }
    const loc = kind === 'q' ? localQ() : localW(), c = col[kind], Pk = P[kind];
    for (const [id, l] of loc) if (Pk[id] !== l.h) { await put(c.doc(id), l.o, id, kind); if (Pk[id] === undefined || Pk[id] !== l.h) Pk[id] = l.h; }
    for (const id of Object.keys(Pk)) if (!loc.has(id)) { await c.doc(id).delete(); delete Pk[id]; }
  }
  function schedule() { clearTimeout(pushT); pushT = setTimeout(push, 1000); }
  async function push() {
    if (!live || pushing) return;
    pushing = true; clearTimeout(retryT);
    try {
      while (dirty.size) {
        setSt('syncing');
        const ks = [...dirty]; dirty.clear();
        try { for (const k of ks) await pushKind(k); } catch (e) { ks.forEach(k => dirty.add(k)); throw e; }
      }
      lastOk = Date.now(); setSt('ok');
    } catch (e) {
      console.error('sync', e); setSt('err', e);
      if (e?.code !== 'quota_exceeded' && e?.code !== 'revoked') retryT = setTimeout(push, 8000);
    } finally { pushing = false; queueSave(K.sync, P); if (dirty.size && !retryT) schedule(); }
  }
  function onSnap(kind, snap) {
    let ch = false;
    try { ch = { q: applyQ, w: applyW, m: applyM }[kind](snap); } catch (e) { console.error(e); }
    if (!snap.metadata.fromCache) { gotFresh = true; clearTimeout(freshT); lastOk = Date.now(); if (!pushing && !dirty.size) setSt('ok'); }
    queueSave(K.sync, P);
    if (ch) { clearTimeout(uiT); uiT = setTimeout(refreshAll, 120); }
  }
  const onErr = e => { console.error('sync', e); setSt('err', e); };

  let unsubs = [], curUid = null, auth = null;
  function attach(c) {
    unsubs.forEach(f => f()); unsubs = [];
    col.q = c.q; col.w = c.w; mRef = c.m; live = true; gotFresh = false;
    clearTimeout(freshT); freshT = setTimeout(() => { if (!gotFresh) setSt('slow'); }, 10000);
    unsubs.push(col.q.onSnapshot(s => onSnap('q', s), onErr), col.w.onSnapshot(s => onSnap('w', s), onErr), mRef.onSnapshot(s => onSnap('m', s), onErr));
  }
  function startFb() {
    firebase.initializeApp(FB_CONFIG); auth = firebase.auth(); const fs = firebase.firestore();
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
    setSt('conn');
    auth.onAuthStateChanged(u => {
      if (!u) { unsubs.forEach(f => f()); unsubs = []; live = false; curUid = null; return setSt('login'); }
      if (u.uid === curUid) return; curUid = u.uid; setSt('conn');
      attach({ q: fs.collection(`users/${u.uid}/questions`), w: fs.collection(`users/${u.uid}/wrongs`), m: fs.doc(`users/${u.uid}/meta/folders`) });
    });
  }
  async function login() {
    if (!auth) return;
    const em = await dialog({ title: '로그인', text: '동기화에 쓸 이메일입니다. 처음이면 계정이 자동으로 만들어집니다.', input: { placeholder: '이메일' }, ok: '다음' });
    if (!em || !em.trim()) return;
    const pd = dialog({ title: '비밀번호', text: '6자 이상', input: { placeholder: '비밀번호' }, ok: '확인' });
    $('#dlgInput').type = 'password'; const pw = await pd; $('#dlgInput').type = 'text';
    if (!pw) return;
    const e1 = em.trim();
    try { await auth.signInWithEmailAndPassword(e1, pw); }
    catch (e) {
      if (['auth/user-not-found', 'auth/invalid-credential', 'auth/invalid-login-credentials'].includes(e.code)) {
        try { await auth.createUserWithEmailAndPassword(e1, pw); }
        catch (e2) { toast(e2.code === 'auth/email-already-in-use' ? '비밀번호가 올바르지 않습니다' : '로그인 실패: ' + (e2.code || ''), 'bad'); }
      } else toast('로그인 실패: ' + (e.code || ''), 'bad');
    }
  }
  async function start(saved) {
    if (saved && typeof saved === 'object') P = { q: saved.q || {}, w: saved.w || {}, m: saved.m || '' };
    if (FB_CONFIG.apiKey && window.firebase) { try { return startFb(); } catch (e) { console.error(e); return setSt('off'); } }
    if (!window.claude?.use) return setSt('off');
    setSt('conn');
    try {
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      const uid = user ? await user.id() : null;
      if (!db || !uid) return setSt('off');
      const root = db.doc('data/users/' + uid + '/profile');
      attach({ q: root.collection('questions'), w: root.collection('wrongs'), m: root.collection('meta').doc('folders') });
    } catch (e) { console.error(e); setSt('off'); }
  }
  function info() {
    const t = lastOk ? new Date(lastOk).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : '';
    return {
      login: '동기화하려면 로그인하세요. 모든 기기에서 같은 이메일과 비밀번호로 로그인하면 문제, 오답노트, 폴더가 자동으로 동기화됩니다.',
      off: '이 기기에만 저장되고 있습니다. 맥북·아이패드·아이폰 간 동기화는 같은 Claude 계정에 로그인한 상태에서 claude.ai의 앱 링크로 열었을 때 켜집니다.',
      conn: '동기화 서버에 연결하는 중입니다.',
      syncing: '변경 내용을 동기화하고 있습니다.',
      ok: '문제, 오답노트, 폴더가 같은 Claude 계정의 다른 기기와 자동으로 동기화됩니다.' + (t ? ` (마지막 확인 ${t})` : ''),
      slow: '서버 응답이 늦습니다. 이 기기의 변경은 안전하게 저장되며 연결되면 자동으로 올라갑니다.',
      err: '동기화에 실패했습니다. 잠시 후 자동으로 다시 시도합니다.' + (errMsg ? `\n(${errMsg})` : '')
    }[st];
  }
  return { start, info, login, logout: () => auth && auth.signOut(), isFb: () => !!auth, state: () => st, touch: k => { if (live) { dirty.add(k); schedule(); } } };
})();
$('#syncBtn').onclick = async () => {
  if (cloud.state() === 'login') return cloud.login();
  if (cloud.isFb()) { if (await dialog({ title: '기기 간 동기화', text: cloud.info(), ok: '로그아웃', cancel: '닫기', danger: true })) cloud.logout(); }
  else dialog({ title: '기기 간 동기화', text: cloud.info(), ok: '확인', cancel: null });
};

(async function init() {
  $('#brandImg').src = $('link[rel="apple-touch-icon"]').href;
  let sync = null;
  try {
    const r = await Promise.all([K.custom, K.folders, K.created, K.wrong, K.sync].map(loadStore));
    D = r[0] || {}; TF = r[1] || {}; CF = r[2] || {}; W = Array.isArray(r[3]) ? r[3] : []; sync = r[4];
    if (backfill()) { save.data(); save.wrong(); }
  } catch {}
  renderHome();
  cloud.start(sync);
})();
})();
</script>
</body>
