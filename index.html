/* ---- 마인드맵 에디터 화면 ---- */
let mmState = { mapId: null, map: null, selectedId: null };

function openMmEditor(mapId) {
  mmState.mapId = mapId;
  mmState.map = MINDMAPS[mapId];
  mmState.selectedId = null;
  document.getElementById('mmEditTitle').textContent = mmState.map.title;
  showScreen(screenMindmapEdit);
  hideMmSideForm();
  renderMmEditor();
}

function renderMmEditor() {
  const svg = document.getElementById('mmSvg');
  svg.innerHTML = '';
  if (!mmState.map) return;
  const positions = computeMmLayout(mmState.map.root);
  const xs = Object.values(positions).map(p => p.x);
  const ys = Object.values(positions).map(p => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const pad = 70;
  svg.setAttribute('viewBox', `${minX - pad} ${minY - pad} ${(maxX - minX) + pad * 2 + 140} ${(maxY - minY) + pad * 2 + 20}`);

  const ns = 'http://www.w3.org/2000/svg';
  // 연결선(곡선) 먼저 그려서 노드 아래로 깔리게
  Object.values(positions).forEach(p => {
    if (!p.parentId) return;
    const parent = positions[p.parentId];
    const x1 = parent.x + 66, y1 = parent.y, x2 = p.x - 66, y2 = p.y;
    const mx = (x1 + x2) / 2;
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
    path.setAttribute('class', 'mm-edge');
    path.setAttribute('stroke', p.node.color || '#38bdf8');
    path.setAttribute('stroke-width', '2');
    svg.appendChild(path);
  });
  // 노드
  Object.values(positions).forEach(p => {
    const g = document.createElementNS(ns, 'g');
    g.setAttribute('class', 'mm-node' + (p.node.id === mmState.selectedId ? ' selected' : ''));
    g.setAttribute('transform', `translate(${p.x},${p.y})`);
    const label = p.node.label || '(빈 노드)';
    const w = Math.max(76, label.length * 13 + 30);
    const rect = document.createElementNS(ns, 'rect');
    rect.setAttribute('x', -w / 2); rect.setAttribute('y', -18);
    rect.setAttribute('width', w); rect.setAttribute('height', 36);
    rect.setAttribute('rx', 10);
    rect.setAttribute('fill', p.node.color || '#334155');
    rect.setAttribute('fill-opacity', '0.85');
    rect.setAttribute('stroke', p.node.color || '#38bdf8');
    g.appendChild(rect);
    const text = document.createElementNS(ns, 'text');
    text.setAttribute('x', 0); text.setAttribute('y', 5);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('fill', '#fff');
    text.setAttribute('font-size', '13');
    text.setAttribute('font-weight', '700');
    text.textContent = label;
    g.appendChild(text);
    if (p.node.questionIds && p.node.questionIds.length) {
      const badge = document.createElementNS(ns, 'circle');
      badge.setAttribute('cx', w / 2 - 2); badge.setAttribute('cy', -16); badge.setAttribute('r', 8);
      badge.setAttribute('fill', '#f87171');
      g.appendChild(badge);
      const bt = document.createElementNS(ns, 'text');
      bt.setAttribute('x', w / 2 - 2); bt.setAttribute('y', -12.5);
      bt.setAttribute('text-anchor', 'middle'); bt.setAttribute('font-size', '9'); bt.setAttribute('fill', '#fff'); bt.setAttribute('font-weight', '700');
      bt.textContent = p.node.questionIds.length;
      g.appendChild(bt);
    }
    g.addEventListener('click', (e) => { e.stopPropagation(); selectMmNode(p.node.id); });
    g.addEventListener('dblclick', (e) => { e.stopPropagation(); addMmChild(p.node.id); });
    svg.appendChild(g);
  });
}

    const span = document.createElement('span');
    span.style.cssText = 'flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
    span.textContent = `[${q.subject}/${q.topic}] ${q.q ? q.q : '(이미지 문제)'} → ${q.a}`;
    item.appendChild(span);
    const btn = document.createElement('button');
    btn.className = linked ? 'primary-btn' : 'ghost-btn';
    btn.style.cssText = 'font-size:11px;padding:5px 10px;flex-shrink:0;';
    btn.textContent = linked ? '연결됨' : '연결';
    btn.addEventListener('click', () => {
      if (!node.questionIds) node.questionIds = [];
      const idx = node.questionIds.indexOf(q.id);
      if (idx >= 0) node.questionIds.splice(idx, 1); else node.questionIds.push(q.id);
      saveMindmaps();
      renderMmLinkModalList(document.getElementById('mmLinkSearch').value);
      renderMmLinkList(node);
      renderMmEditor();
    });
    item.appendChild(btn);
    wrap.appendChild(item);
  });
}

/* ---- 마인드맵 학습(암기) 모드 ---- */
let mmStudy = { list: [], index: 0, includeQuestions: true, mode: 'seq', currentQ: null };

function openMmStudyFromList(mapId) {
  mmState.mapId = mapId;
  mmState.map = MINDMAPS[mapId];
  document.getElementById('mmStudyTitle').textContent = mmState.map.title;
  document.getElementById('mmStudyModeSelect').classList.remove('hidden');
  document.getElementById('mmStudyProgress').classList.add('hidden');
  document.getElementById('mmModeSeq').classList.add('selected');
  document.getElementById('mmModeRand').classList.remove('selected');
  showScreen(screenMindmapStudy);
}

document.getElementById('mmModeSeq').addEventListener('click', () => {
  document.getElementById('mmModeSeq').classList.add('selected');
  document.getElementById('mmModeRand').classList.remove('selected');
});
document.getElementById('mmModeRand').addEventListener('click', () => {
  document.getElementById('mmModeRand').classList.add('selected');
  document.getElementById('mmModeSeq').classList.remove('selected');
});

document.getElementById('btnMmStudyStart').addEventListener('click', () => {
  const mode = document.getElementById('mmModeRand').classList.contains('selected') ? 'rand' : 'seq';
  const includeQuestions = document.getElementById('mmIncludeQuestions').checked;
  let list = flattenMmTree(mmState.map.root);
  if (mode === 'rand') list = shuffle(list);
  mmStudy = { list, index: 0, includeQuestions, mode, currentQ: null };
  document.getElementById('mmStudyModeSelect').classList.add('hidden');
  document.getElementById('mmStudyProgress').classList.remove('hidden');
  renderMmStudyStep();
});
document.getElementById('btnMmStudyBack').addEventListener('click', () => {
  showScreen(screenMindmapList);
  renderMmList();
});
document.getElementById('btnMmStudyPrev').addEventListener('click', () => {
  if (mmStudy.index > 0) { mmStudy.index--; renderMmStudyStep(); }
});
document.getElementById('btnMmStudyNext').addEventListener('click', () => {
  if (mmStudy.index < mmStudy.list.length - 1) { mmStudy.index++; renderMmStudyStep(); }
  else { alert('마지막 노드입니다. 수고하셨습니다! 🎉'); }
});

function renderMmStudyStep() {
  const node = mmStudy.list[mmStudy.index];
  document.getElementById('mmStudyCounter').textContent = `${mmStudy.index + 1} / ${mmStudy.list.length}`;
  document.getElementById('mmStudyMapName').textContent = mmState.map.title;
  document.getElementById('mmStudyBar').style.width = `${((mmStudy.index + 1) / mmStudy.list.length) * 100}%`;
  document.getElementById('mmStudyNodeLabel').textContent = node.label;
  document.getElementById('mmStudyCard').style.borderColor = node.color || 'var(--accent)';

  // 브레드크럼: 루트 → ... → 현재 노드, 각 조상 클릭 시 그 노드로 즉시 이동
  const chain = [];
  (function buildChain(n) {
    chain.unshift(n);
    const p = findMmParent(mmState.map.root, n.id);
    if (p) buildChain(p);
  })(node);
  const bcWrap = document.getElementById('mmStudyBreadcrumb');
  bcWrap.innerHTML = '';
  chain.forEach((n, i) => {
    if (i > 0) {
      const sep = document.createElement('span');
      sep.className = 'bc-sep';
      sep.textContent = '→';
      bcWrap.appendChild(sep);
    }
    const item = document.createElement('span');
    item.className = 'bc-item' + (n.id === node.id ? ' current' : '');
    item.style.cursor = 'pointer';
    item.textContent = n.label;
    item.addEventListener('click', () => {
      const idx = mmStudy.list.findIndex(x => x.id === n.id);
      if (idx >= 0) { mmStudy.index = idx; renderMmStudyStep(); }
    });
    bcWrap.appendChild(item);
  });

  const subParts = [];
  if (node.children && node.children.length) subParts.push(`하위 ${node.children.length}개`);
  if (node.questionIds && node.questionIds.length) subParts.push(`문제 ${node.questionIds.length}개`);
  document.getElementById('mmStudyNodeSub').textContent = subParts.join(' · ');

  renderMmMinimap(node.id);

  // 연결된 문제(있으면 첫 번째 문제로 즉시 타자 퀴즈 연계)
  const qWrap = document.getElementById('mmStudyQWrap');
  const input = document.getElementById('mmStudyQInput');
  input.value = '';
  input.classList.remove('correct', 'wrong');
  document.getElementById('mmStudyQFeedback').textContent = '';
  mmStudy.currentQ = null;
  if (mmStudy.includeQuestions && node.questionIds && node.questionIds.length) {
    const all = getAllQuestionsFlat();
    const q = all.find(x => x.id === node.questionIds[0]);
    if (q) {
      qWrap.classList.remove('hidden');
      document.getElementById('mmStudyQText').textContent = q.q || '(이미지 문제)';
      const imgEl = document.getElementById('mmStudyQImg');
      if (q.img) { imgEl.src = q.img; imgEl.style.display = 'block'; } else { imgEl.style.display = 'none'; }
      mmStudy.currentQ = q;
      setTimeout(() => input.focus(), 0);
    } else {
      qWrap.classList.add('hidden');
    }
  } else {
    qWrap.classList.add('hidden');
  }
}

document.getElementById('mmStudyQInput').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const input = e.target;
  const q = mmStudy.currentQ;
  if (!q) return;
  if (isAnswerCorrect(input.value, q)) {
    input.classList.remove('wrong'); input.classList.add('correct');
    document.getElementById('mmStudyQFeedback').innerHTML = '<span style="color:var(--good);">✅ 정답입니다!</span>';
  } else {
    input.classList.remove('correct'); input.classList.add('wrong');
    document.getElementById('mmStudyQFeedback').innerHTML = `<span style="color:var(--bad);">❌ 정답: ${getKeywords(q)[0]}</span>`;
  }
});

// 미니맵: 전체 트리를 작게 그려서 현재 위치(어느 가지에서 뻗어나왔는지)를 하이라이트
function renderMmMinimap(currentId) {
  const svg = document.getElementById('mmMinimapSvg');
  svg.innerHTML = '';
  const positions = computeMmLayout(mmState.map.root);
  const xs = Object.values(positions).map(p => p.x);
  const ys = Object.values(positions).map(p => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const pad = 26;
  svg.setAttribute('viewBox', `${minX - pad} ${minY - pad} ${(maxX - minX) + pad * 2 + 30} ${(maxY - minY) + pad * 2}`);
  const ns = 'http://www.w3.org/2000/svg';
  Object.values(positions).forEach(p => {
    if (!p.parentId) return;
    const parent = positions[p.parentId];
    const line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', parent.x); line.setAttribute('y1', parent.y);
    line.setAttribute('x2', p.x); line.setAttribute('y2', p.y);
    line.setAttribute('stroke', '#334155'); line.setAttribute('stroke-width', '1.5');
    svg.appendChild(line);
  });
  Object.values(positions).forEach(p => {
    const isCurrent = p.node.id === currentId;
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('cx', p.x); c.setAttribute('cy', p.y);
    c.setAttribute('r', isCurrent ? 8 : 4);
    c.setAttribute('fill', isCurrent ? '#fff' : (p.node.color || '#38bdf8'));
    c.setAttribute('stroke', isCurrent ? (p.node.color || '#38bdf8') : 'none');
    c.setAttribute('stroke-width', isCurrent ? 3 : 0);
    svg.appendChild(c);
  });
}
